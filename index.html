<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>～あの音、この音。～クイズ</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#2a2420; --sub:#6b6058;
    --accent:#b23a2a; --ok:#2f7d4f; --ng:#9a3b2e; --line:#e3d9c8; --ph:#e9e1d3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .label{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:700}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;padding:6px 14px;font-size:13px;color:var(--sub);cursor:pointer}
  .lang button.on{background:var(--ink);color:#fff}
  h1{font-size:22px;line-height:1.45;margin:4px 0 20px}

  /* 写真・動画（素材がないときは「準備中」の枠） */
  .photo{display:block;width:100%;border-radius:14px;margin-bottom:10px;object-fit:cover}
  .name{margin:0 0 16px;text-align:center;font-size:16px;font-weight:700;color:var(--accent)}
  .ph{display:grid;place-items:center;text-align:center;width:100%;border-radius:14px;
    background:var(--ph);border:2px dashed #cdbfa8;color:var(--sub);font-size:14px;padding:12px}
  .ph.photo-ph{aspect-ratio:4/3;margin-bottom:10px}
  .ph.video-ph{aspect-ratio:16/9}
  .ph b{display:block;font-size:16px;color:var(--ink)}
  video{display:block;width:100%;border-radius:14px;background:#000}

  .play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    border:0;border-radius:14px;background:var(--accent);color:#fff;
    font-size:18px;font-weight:700;padding:16px;cursor:pointer}
  .play svg{width:22px;height:22px;fill:currentColor}
  .play.small{width:auto;font-size:14px;padding:8px 16px;margin-top:10px;border-radius:999px}
  .sound{margin-bottom:20px}
  .note{font-size:12px;color:var(--sub);margin:8px 0 0;text-align:center}

  .choices{display:grid;gap:12px}
  .choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:14px;
    padding:16px;font-size:17px;color:var(--ink);cursor:pointer}
  .choice .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);
    display:grid;place-items:center;font-weight:700;font-size:15px}
  .choice:disabled{cursor:default}
  .choice.correct{border-color:var(--ok);background:#eaf5ee}
  .choice.correct .n{background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--ng);background:#f8ebe8}
  .choice.dim{opacity:.45}

  .result{margin-top:24px;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--line)}
  .verdict{font-size:26px;font-weight:800;margin:0 0 4px}
  .verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
  .answer{font-weight:700;margin:0 0 12px}
  .explain{margin:0 0 20px;white-space:pre-line}  /* 解説の改行をそのまま表示 */
  .more{margin:20px 0 0;text-align:center;color:var(--sub);font-size:14px}
  .privacy{margin:32px 0 0;text-align:center;color:var(--sub);font-size:11px}

  /* 成績（スタンプ） */
  .locked{margin:0 0 10px;font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:6px 10px}
  .progress{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);text-align:center}
  .stamps{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0}
  .stamp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;
    border:2px solid var(--line);color:var(--sub);background:#fff}
  .stamp.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .stamp.ng{background:#d8cfc2;border-color:#d8cfc2;color:#fff}
  .score{font-size:15px;font-weight:700;margin:4px 0}
  .hint{font-size:13px;color:var(--sub);margin:4px 0 0}
  .go{display:inline-block;margin-top:12px;padding:12px 22px;border-radius:999px;background:var(--ink);color:#fff;
    font-weight:700;text-decoration:none}

  /* 成績の画面 */
  .final{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;text-align:center}
  .final h1{margin:0 0 4px}
  .big{font-size:44px;font-weight:800;margin:8px 0 0;line-height:1.2}
  .big small{font-size:18px;font-weight:700}
  .prize{margin:16px 0 0;padding:14px;border-radius:12px;background:#fdf3e0;border:2px solid #e2b866;font-weight:700}
  .prize b{display:block;font-size:20px;color:var(--accent)}
  .clock{margin:18px 0 0;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
  .clock .t{font-size:24px;font-weight:800}
  .live{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d6342b;margin-right:6px;
    vertical-align:middle;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.15}}
  .redeemed{margin:16px 0 0;padding:14px;border-radius:12px;border:3px solid var(--ng);color:var(--ng);
    font-size:22px;font-weight:800;transform:rotate(-3deg)}
  .staffArea{margin-top:28px;padding-top:16px;border-top:1px dashed var(--line)}
  .staffArea p{margin:0 0 8px;font-size:13px;color:var(--sub);white-space:pre-line}
  .staff{display:block;width:100%;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;
    padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer}
  .staff:active{background:var(--bg)}
</style>

<div class="wrap">
  <div class="top">
    <span class="label" id="label"></span>
    <div class="lang">
      <button data-l="ja">日本語</button>
      <button data-l="en">English</button>
    </div>
  </div>

  <!-- 問題の部分（型によって並びが変わる） -->
  <div id="stage"></div>

  <!-- 答えの部分（どの型も同じ） -->
  <div class="result" id="result" hidden>
    <p class="locked" id="lockedNote" hidden></p>
    <p class="verdict" id="verdict"></p>
    <p class="answer" id="answer"></p>
    <p class="explain" id="explain"></p>
    <div id="videoArea"></div>
    <p class="note" id="videoNote"></p>
    <div class="progress" id="progress"></div>
    <p class="more" id="more"></p>
  </div>

  <!-- 成績の画面（?result で開く。受付で見せる画面） -->
  <div id="finalPage" hidden></div>

  <p class="privacy" id="privacy"></p>
</div>

<script>
// =====================================================================
// 問題データ（1問 = 1ブロック）
//
// type: "photo"  … 写真 → 問題文 → 三択        （写真を見て音を想像する）
//       "listen" … 写真 → 音の再生ボタン → 問題文 → 三択（音を聴いて答える）
// どちらも、答えたあとは「正解発表 → 解説 → 動画」
//
// photo : 写真ファイル（例 "images/q01.jpg"）  空（""）なら「写真 準備中」の枠
//         listen型で写真を使わない問題は、photo の行ごと消す
// sound : 問題で聴かせる音（例 "audio/q02.mp3"）空なら仮の音
// video : 答えのあとの動画（例 "video/q01.mp4"）空なら「動画 準備中」の枠
// answer: 正解の番号（1〜3）
// 問題文の「|」は、スマホで改行してよい区切りの位置
// QRコードのアドレス: https://puppetman03140823-commits.github.io/gakki-quiz/?q=（id）
// =====================================================================
const QUIZ = [
  {
    id: "amaoto", type: "listen", answer: 3,   // 【1】雨音
    // 櫓太鼓
    photo: "images/amaoto.jpg", sound: "", video: "",
    ja: { name: "櫓太鼓（やぐらだいこ）",
          question: "この音は、|何の音？",
          choices: ["相撲の力士の登場", "モールス信号の音", "雨が降る音"],
          explain: "櫓太鼓を細い竹のバチで叩くことで、昔の板屋根や番傘に雨粒が打ち付けられるような、パラパラという雨音をリアルに表現しています。" },
    en: { name: "Yagura-daiko (tower drum)",
          question: "What is this sound?",
          choices: ["A sumo wrestler entering", "Morse code", "Rain falling"],
          explain: "Struck with thin bamboo sticks, the yagura-daiko realistically recreates the pattering sound of raindrops hitting an old wooden roof or a traditional oiled-paper umbrella (bangasa)." }
  },
  {
    id: "geta", type: "photo", answer: 2,   // 【2】八ツ割下駄（写真は表と裏返しの2足）
    photo: "images/geta.jpg", video: "",
    ja: { name: "底に切れ目が入った下駄",
          question: "この下駄は、|どんな時に使う？",
          choices: ["少し身長を高く見せたい時", "人形の足音を表現する時", "土の上でお芝居をする時"],
          explain: "これは「八ツ割下駄」と呼ばれるものです。お芝居では下駄を履いた人形が、歩く時の足音を表現するために使います。" },
    en: { name: "Geta clogs with slits in the sole",
          question: "When are these geta clogs used?",
          choices: ["To make a puppet look a little taller", "To make a puppet's footsteps", "To perform on bare ground"],
          explain: "These are called \"yatsuwari geta\" (split wooden clogs). In the play, they are used to make the sound of footsteps when a puppet wearing geta walks." }
  },
  {
    id: "kaigara", type: "photo", answer: 3,   // 【3】貝殻
    photo: "images/kaigara.jpg", video: "",
    ja: { name: "赤貝の貝殻",
          question: "この貝殻で、|どんな音を表現する？",
          choices: ["砂の上を歩く音", "ご飯を食べる音", "カエルの鳴き声"],
          explain: "貝殻の表面のギザギザ同士をこすり合わせることで、カエルの鳴き声のような音がします。池が出てくるお芝居などで使われています。" },
    en: { name: "Ark shell",
          question: "What sound is made with these shells?",
          choices: ["Footsteps on sand", "Someone eating rice", "Frogs croaking"],
          explain: "Rubbing the ridged surfaces of the shells together makes a sound like frogs croaking. It is used in plays with scenes by a pond." }
  },
  {
    id: "namioto", type: "listen", answer: 3,   // 【4】波音
    // 平太鼓＋長バチを横に並べた合成写真
    photo: "images/namioto.jpg", sound: "", video: "",
    ja: { name: "平太鼓と長バチ",
          question: "この音は、|何の音？",
          choices: ["鬼が登場する音", "マシンガンの音", "波が岩にぶつかる音"],
          explain: "この音は「波音」と呼ばれるもので、海の波が岩場にぶつかる音を表現しています。浜辺が舞台のお芝居で使われます。" },
    en: { name: "A hira-daiko (flat drum) and long sticks",
          question: "What is this sound?",
          choices: ["An ogre appearing", "A machine gun", "Waves crashing against rocks"],
          explain: "This is called \"nami-oto\" (wave sound). It represents ocean waves crashing against rocks, and is used in plays set on the seashore." }
  },
  {
    id: "yukioto", type: "listen", answer: 1,   // 【5】雪音
    // 平太鼓＋銅鑼バチを横に並べた合成写真
    photo: "images/yukioto.jpg", sound: "", video: "",
    ja: { name: "平太鼓と銅鑼バチ",
          question: "この音は、|何の音？",
          choices: ["雪の降る音", "花火", "布団をたたく音"],
          explain: "現実では雪は音もなく降りますが、お芝居では「雪音」という音を使って、雪が降る時の気配のようなものを表現します。" },
    en: { name: "A hira-daiko (flat drum) and a gong mallet",
          question: "What is this sound?",
          choices: ["Snow falling", "Fireworks", "Beating a futon"],
          explain: "In real life, snow falls without a sound. But in the theater, a sound called \"yuki-oto\" (snow sound) is used to express the quiet feeling of falling snow." }
  },
  {
    id: "ekiro", type: "listen", answer: 1,   // 【6】駅路の鈴
    photo: "images/ekiro.jpg", sound: "", video: "",
    ja: { name: "駅路の鈴",
          question: "この楽器の音は、|どんな時に使う？",
          choices: ["馬が登場するとき", "お経を唱える時", "カラオケで盛り上げる時"],
          explain: "江戸時代、当時の主要な交通手段の一つである馬には、首元に鈴が提げられ、車のクラクションのような役割を果たしていました。この駅路の鈴はその音を模したもので、お芝居では馬が登場する場面などで使用されます。" },
    en: { name: "Ekiro no suzu (post-road bell)",
          question: "When is the sound of this instrument used?",
          choices: ["When a horse comes on stage", "When a sutra is chanted", "To liven up karaoke"],
          explain: "In the Edo period, horses were one of the main ways to travel, and they wore bells around their necks that worked much like a car horn. This instrument, called \"ekiro no suzu,\" imitates that sound. In plays, it is used in scenes where a horse appears." }
  },
  {
    id: "tooyose", type: "listen", answer: 2,   // 【7】遠寄せ（とおよせ）
    // 平太鼓＋銅鑼を横に並べた合成写真
    photo: "images/tooyose.jpg", sound: "", video: "",
    ja: { name: "平太鼓と銅鑼",
          question: "どんな時に使う音？",
          choices: ["夫婦げんかの音", "合戦の場面", "お祭りの場面"],
          explain: "これは遠寄せ（とおよせ）と呼ばれる音で、合戦の場面で「遠巻きに軍勢が攻め寄せてくる様子」を表現するものです。\n戦場における、ほら貝・陣太鼓・陣鉦（じんがね）などの音を模しています。" },
    en: { name: "A hira-daiko (flat drum) and a gong",
          question: "When is this sound used?",
          choices: ["A married couple quarreling", "In a battle scene", "In a festival scene"],
          explain: "This sound is called \"tooyose.\" In battle scenes it expresses an army closing in from a distance.\nIt imitates the sounds heard on a battlefield: conch shell horns, war drums and war gongs (jingane)." }
  },
  {
    id: "takebora", type: "photo", answer: 2,   // 【8】竹の楽器（プレゼン用QRと同じid。変えないこと）
    photo: "images/takebora.jpg", video: "",
    ja: { name: "小さな穴が開いた竹筒",
          question: "この楽器で、|どんな音を表現する？",
          choices: ["牛の鳴き声", "ほら貝", "ししおどし"],
          explain: "竹の筒に穴をあけたこの楽器は竹ぼらと呼ばれ、戦の場面などで「ほら貝」の音を表すのに使われます。本物のほら貝の代わりに、舞台の効果音として鳴らします。" },
    en: { name: "A bamboo tube with small holes",
          question: "What sound does this instrument imitate?",
          choices: ["A cow mooing", "A conch shell horn", "A shishi-odoshi (bamboo water clapper)"],
          explain: "This bamboo tube with holes, called \"takebora,\" imitates the sound of a conch shell horn, often heard in battle scenes. It is used on stage as a sound effect in place of a real conch." }
  }
  // 問題は全8問で確定（2026-10-01）
];

const UI = {
  ja: { label:"～あの音、この音。～クイズ", ok:"正解！", ng:"ざんねん…", ans:"答え：",
        listen:"音を聴く", playing:"再生中…", tmpSound:"仮の音を聴く",
        mute:"🔇 音が出ないときは、マナーモードを解除してください",
        photoPh:"写真", videoPh:"動画", soon:"準備中",
        more:"ほかのパネルの楽器にも挑戦してみよう",
        privacy:"このページでは、開かれた回数を数えています（個人を特定する情報は集めていません）",
        locked:"この問題は回答済みです。最初に選んだ答えが記録されています。",
        score:(a, c) => `いまの成績：${a}／${QUIZ.length}問に回答・正解 ${c}問`,
        left:(n) => `あと${n}問。ほかのパネルのQRコードも読んでみよう`,
        allDone:"全問回答しました！",
        seeResult:"成績を見る",
        resultTitle:"あなたの成績",
        resultBig:(c) => `${c}`, resultOf:`／${QUIZ.length}問 正解`,
        notYet:(n, m) => `まだ${n}問、答えていない問題があります。` + (m ? `すべて答えて${m}問以上正解すると、受付でプレゼントを受け取れます。` : `すべて答えると、受付でプレゼントを受け取れます。`),
        showDesk:"この画面を受付で見せてください",
        thanks:"参加ありがとうございました！",
        now:"いまの時刻",
        redeemed:"受け取り済み",
        redeemedAt:(t) => `${t} に受け取りました`,
        staffNote:"受付スタッフの方へ\nプレゼントを渡したら押してください",
        staffBtn:"受け取り済みにする",
        staffConfirm:"スタッフの方が、プレゼントを渡したときに押してください。\n押すと元に戻せません。受け取り済みにしますか？" },
  en: { label:"Guess That Sound Quiz", ok:"Correct!", ng:"Not quite…", ans:"Answer: ",
        listen:"Listen", playing:"Playing…", tmpSound:"Play sample sound",
        mute:"🔇 No sound? Please turn off silent mode.",
        photoPh:"Photo", videoPh:"Video", soon:"Coming soon",
        more:"Try the other instruments in the exhibit!",
        privacy:"This page counts how many times it is opened. No personal information is collected.",
        locked:"You have already answered this question. Your first answer has been recorded.",
        score:(a, c) => `Your progress: ${a}/${QUIZ.length} answered, ${c} correct`,
        left:(n) => `${n} to go. Find the QR codes on the other panels!`,
        allDone:"You have answered every question!",
        seeResult:"See my score",
        resultTitle:"Your score",
        resultBig:(c) => `${c}`, resultOf:` / ${QUIZ.length} correct`,
        notYet:(n, m) => `${n} question(s) left. ` + (m ? `Answer them all and get ${m} or more right to receive a gift at the reception desk.` : `Answer them all to receive a gift at the reception desk.`),
        showDesk:"Please show this screen at the reception desk",
        thanks:"Thank you for playing!",
        now:"Current time",
        redeemed:"Gift received",
        redeemedAt:(t) => `Received at ${t}`,
        staffNote:"For reception staff:\npress after handing over the gift",
        staffBtn:"Mark as received",
        staffConfirm:"Staff: press this when you hand over the gift.\nThis cannot be undone. Mark as received?" }
};

// =====================================================================
// プレゼントの設定（条件が決まったら、ここだけ書き換える）
// needAll : true = 全8問に答えた人だけ「受付で見せてください」を出す
// tiers   : 正解数ごとのプレゼント。上から順に見て、最初に当てはまったものを出す
//           空 [] のあいだは、正解数と「受付で見せてください」だけを出す
//           ja/en（景品名）は省略できる。省略すると名前は出さない
//           例: [ { min: 8, ja: "全問正解賞", en: "Perfect Score Prize" },
//                 { min: 5, ja: "がんばったで賞", en: "Great Job Prize" } ]
//           どれにも当てはまらない人には「参加ありがとうございました」だけを出す
// =====================================================================
const PRIZE = {
  needAll: true,
  tiers: [ { min: 5 } ]   // 2026-10-03 仮決定：5問以上正解でプレゼント（景品名はまだなので出さない）
};

const params = new URLSearchParams(location.search);
const isResultPage = params.has("result");   // ?result = 成績の画面
// ★テスト期間だけ★ ?reset = このスマホのクイズの記録だけを消す。本番の前に必ずこの機能を消すこと
const isResetPage = params.has("reset");
const id = params.get("q");
const q = QUIZ.find(x => x.id === id) || QUIZ[0];
let lang = (navigator.language || "ja").startsWith("ja") ? "ja" : "en";

// ---- 成績の記録（このスマホの中だけに保存。名前などは持たない）----
// gq_answers_v1  = { 問題id: { pick: 選んだ番号(0〜2), correct: true/false, ts: 答えた日時 } }
// gq_redeemed_v1 = プレゼントを受け取った日時（ミリ秒）
const ANS_KEY = "gq_answers_v1", REDEEM_KEY = "gq_redeemed_v1";
function loadAnswers(){
  try { return JSON.parse(localStorage.getItem(ANS_KEY)) || {}; } catch (e) { return {}; }
}
function saveFirstAnswer(qid, pick, correct){
  const a = loadAnswers();
  if (a[qid]) return;                                  // ズル防止①：最初の答えだけ有効
  a[qid] = { pick, correct, ts: Date.now() };
  try { localStorage.setItem(ANS_KEY, JSON.stringify(a)); } catch (e) {}
}
function loadRedeemed(){
  try { return Number(localStorage.getItem(REDEEM_KEY)) || 0; } catch (e) { return 0; }
}
function scoreNow(){
  const a = loadAnswers();
  const done = QUIZ.filter(x => a[x.id]);
  return { a, answered: done.length, correct: done.filter(x => a[x.id].correct).length };
}

const prev = loadAnswers()[q.id];
let picked = prev && Number.isInteger(prev.pick) ? prev.pick : null;   // 回答済みなら最初の答えで表示
let lockedOnLoad = picked !== null;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

function placeholder(kind, label){
  const d = el("div", "ph " + kind);
  d.innerHTML = `<div><b></b><span></span></div>`;
  d.querySelector("b").textContent = label;
  d.querySelector("span").textContent = UI[lang].soon;
  return d;
}

// 「|」の位置でだけ改行させる見出し
function heading(text){
  const h = el("h1");
  text.split("|").forEach(part => {
    const s = el("span", null, part);
    s.style.display = "inline-block";
    h.appendChild(s);
  });
  return h;
}

function soundButton(file, text, small){
  const b = el("button", "play" + (small ? " small" : ""));
  b.innerHTML = playIcon + "<span></span>";
  b.lastChild.textContent = text;
  b.onclick = () => playSound(file, b, text);
  return b;
}

function render(){
  const t = q[lang], u = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  label.textContent = u.label;
  privacy.textContent = u.privacy;

  // ---- 問題の部分 ----
  stage.innerHTML = "";
  if (q.type === "photo"){
    if (q.photo){
      const img = el("img", "photo"); img.src = q.photo; img.alt = "";
      stage.appendChild(img);
    } else {
      stage.appendChild(placeholder("photo-ph", u.photoPh));
    }
    if (t.name) stage.appendChild(el("p", "name", t.name));   // 写真の下の名前
    stage.appendChild(heading(t.question));
  } else {
    if (q.photo){
      const img = el("img", "photo"); img.src = q.photo; img.alt = "";
      stage.appendChild(img);
    } else if (q.photo === ""){
      stage.appendChild(placeholder("photo-ph", u.photoPh));
    }
    if (t.name) stage.appendChild(el("p", "name", t.name));   // 写真の下の名前
    const box = el("div", "sound");
    box.appendChild(soundButton(q.sound, u.listen));
    box.appendChild(el("p", "note", u.mute));
    stage.appendChild(box);
    stage.appendChild(heading(t.question));
  }

  const list = el("div", "choices");
  t.choices.forEach((c, i) => {
    const b = el("button", "choice");
    b.innerHTML = `<span class="n">${i+1}</span><span></span>`;
    b.lastChild.textContent = c;
    if (picked !== null){
      b.disabled = true;
      if (i === q.answer - 1) b.classList.add("correct");
      else if (i === picked) b.classList.add("wrong");
      else b.classList.add("dim");
    }
    b.onclick = () => {
      if (picked !== null) return;
      picked = i;
      saveFirstAnswer(q.id, i, i === q.answer - 1);
      render();
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    list.appendChild(b);
  });
  stage.appendChild(list);

  // ---- 答えの部分 ----
  result.hidden = picked === null;
  if (picked === null) return;
  const ok = picked === q.answer - 1;
  verdict.textContent = ok ? u.ok : u.ng;
  verdict.className = "verdict " + (ok ? "ok" : "ng");
  answer.textContent = u.ans + t.choices[q.answer - 1];
  explain.textContent = t.explain;
  more.textContent = u.more;
  videoNote.textContent = u.mute;
  lockedNote.hidden = !lockedOnLoad;
  lockedNote.textContent = u.locked;
  renderProgress();

  if (!videoArea.dataset.lang || videoArea.dataset.lang !== lang || !videoArea.firstChild){
    videoArea.innerHTML = "";
    if (q.video){
      const v = el("video");
      v.src = q.video; v.controls = true; v.playsInline = true; v.preload = "metadata";
      videoArea.appendChild(v);
    } else {
      const ph = placeholder("video-ph", u.videoPh);
      ph.firstChild.appendChild(soundButton("", u.tmpSound, true)); // 動画ができるまでの仮の音
      videoArea.appendChild(ph);
    }
    videoArea.dataset.lang = lang;
  }
}

// ---- 答えのあとの「いまの成績」（スタンプ8個）----
function stampsEl(a){
  const box = el("div", "stamps");
  QUIZ.forEach((x, i) => {
    const r = a[x.id];
    box.appendChild(el("span", "stamp" + (r ? (r.correct ? " ok" : " ng") : ""), String(i + 1)));
  });
  return box;
}
function resultUrl(){
  return location.pathname + "?result";
}
function renderProgress(){
  const u = UI[lang], s = scoreNow();
  progress.innerHTML = "";
  progress.appendChild(stampsEl(s.a));
  progress.appendChild(el("p", "score", u.score(s.answered, s.correct)));
  const left = QUIZ.length - s.answered;
  progress.appendChild(el("p", "hint", left > 0 ? u.left(left) : u.allDone));
  if (left === 0){
    const go = el("a", "go", u.seeResult); go.href = resultUrl();
    progress.appendChild(go);
  }
}

// ---- 成績の画面（受付で見せる）----
function pad(n){ return String(n).padStart(2, "0"); }
function fmtDate(d){
  return lang === "ja"
    ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`
    : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}
function fmtTime(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
let clockTimer = null;
function renderFinal(){
  const u = UI[lang], s = scoreNow(), redeemedAt = loadRedeemed();
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  label.textContent = u.label;
  privacy.textContent = u.privacy;
  stage.hidden = true; result.hidden = true; finalPage.hidden = false;
  finalPage.innerHTML = "";

  const card = el("div", "final");
  card.appendChild(el("h1", null, u.resultTitle));
  const big = el("p", "big", u.resultBig(s.correct));
  big.appendChild(el("small", null, u.resultOf));
  card.appendChild(big);
  card.appendChild(stampsEl(s.a));

  const left = QUIZ.length - s.answered;
  const tier = PRIZE.tiers.find(t => s.correct >= t.min);
  // プレゼントを渡せる人か（全問回答の条件を満たし、景品の条件にも当てはまる）
  const eligible = !(PRIZE.needAll && left > 0) && !(PRIZE.tiers.length && !tier);
  if (redeemedAt){
    // ズル防止③：受け取り済みなら、もうプレゼントの案内は出さない
    card.appendChild(el("p", "redeemed", u.redeemed));
    const d = new Date(redeemedAt);
    card.appendChild(el("p", "hint", u.redeemedAt(`${fmtDate(d)} ${fmtTime(d).slice(0, 5)}`)));
  } else if (PRIZE.needAll && left > 0){
    card.appendChild(el("p", "hint", u.notYet(left, PRIZE.tiers.length ? Math.min(...PRIZE.tiers.map(t => t.min)) : 0)));
  } else {
    if (!eligible){
      card.appendChild(el("p", "prize", u.thanks));
    } else {
      const p = el("div", "prize");
      if (tier && tier[lang]) p.appendChild(el("b", null, tier[lang]));   // 景品名があるときだけ出す
      p.appendChild(document.createTextNode(u.showDesk));
      card.appendChild(p);
    }
  }

  // ズル防止②：今日の日付と、秒まで動く時計（スクショだと止まっているので見分けられる）
  const clock = el("div", "clock");
  clock.innerHTML = `<span class="live"></span><span class="d"></span><br><span class="t"></span>`;
  card.appendChild(clock);
  const tick = () => {
    const n = new Date();
    clock.querySelector(".d").textContent = `${u.now}　${fmtDate(n)}`;
    clock.querySelector(".t").textContent = fmtTime(n);
  };
  tick(); clearInterval(clockTimer); clockTimer = setInterval(tick, 1000);

  if (!redeemedAt && eligible){
    const staff = el("button", "staff", u.staffBtn);
    staff.onclick = () => {
      if (!window.confirm(u.staffConfirm)) return;
      try { localStorage.setItem(REDEEM_KEY, String(Date.now())); } catch (e) {}
      renderFinal();
    };
    const area = el("div", "staffArea");
    area.appendChild(el("p", null, u.staffNote));
    area.appendChild(staff);
    card.appendChild(area);
  }
  finalPage.appendChild(card);
  // 問題へのリンクは置かない（パネルを回ってQRを読んでもらうため）
}

// ★テスト期間だけ★ クイズの記録（成績・回答済み・受け取り済み）だけを消す画面
// 買い物メモ・きんたろうランなど、同じ github.io のほかのアプリの記録には触らない
function renderReset(){
  stage.hidden = true; result.hidden = true; finalPage.hidden = false;
  label.textContent = UI[lang].label;
  privacy.textContent = UI[lang].privacy;
  finalPage.innerHTML = "";
  const card = el("div", "final");
  card.appendChild(el("h1", null, "テスト用：記録のリセット"));
  const msg = el("p", "hint", "このスマホに残っている、このクイズの成績・回答済み・受け取り済みの記録を消します。");
  card.appendChild(msg);
  const btn = el("button", "staff", "クイズの記録を消す");
  btn.onclick = () => {
    if (!window.confirm("このスマホのクイズの記録を消して、最初から試せるようにします。よろしいですか？")) return;
    try { localStorage.removeItem(ANS_KEY); localStorage.removeItem(REDEEM_KEY); } catch (e) {}
    msg.textContent = "消しました。QRコードを読むと、最初から試せます。";
    btn.remove();
  };
  card.appendChild(btn);
  finalPage.appendChild(card);
}

function draw(){ isResetPage ? renderReset() : isResultPage ? renderFinal() : render(); }
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; draw(); });

// ---- 音の再生（iPhoneで鳴りやすいよう <audio> で鳴らす）----
let audioEl = null, tmpUrl = null;
function playSound(file, btn, text){
  const src = file || (tmpUrl ||= makePlaceholderWav());
  if (!audioEl) audioEl = new Audio();
  if (audioEl.dataset.src !== src){ audioEl.src = src; audioEl.dataset.src = src; }
  audioEl.currentTime = 0;
  audioEl.play().catch(() => {});
  btn.lastChild.textContent = UI[lang].playing;
  audioEl.onended = () => { btn.lastChild.textContent = text; };
}

// 素材がないときの仮の音（ブォーという低い音）をWAVとして作る
function makePlaceholderWav(){
  const rate = 22050, dur = 2.2, n = Math.floor(rate * dur);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  let phase = 0, lp = 0;
  const k = 1 - Math.exp(-2 * Math.PI * 700 / rate); // ローパス（こもった音にする）
  for (let i = 0; i < n; i++){
    const t = i / rate;
    const freq = 110 - 12 * (t / dur);
    phase = (phase + freq / rate) % 1;
    lp += k * ((phase * 2 - 1) - lp);
    const env = t < 0.3 ? t / 0.3 : t > 1.6 ? Math.max(0, (dur - t) / 0.6) : 1;
    v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, lp * env * 0.8)) * 32767, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

draw();

// ---- 開かれた回数を数える（ページを開いたときに1回だけ知らせる）----
// 送るのは「何番の問題か・日本語か英語か・スマホごとの目印（でたらめな番号）」だけ
// アドレスに &nocount を付けると数えない（確認作業用）
(function countOpen(){
  if (isResultPage || isResetPage || params.has("nocount")) return;   // 成績の画面・リセット画面は数えない
  let visitor = null;
  try {
    visitor = localStorage.getItem("gq_visitor");
    if (!visitor){
      visitor = (crypto.randomUUID ? crypto.randomUUID()
        : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12)).toLowerCase();
      localStorage.setItem("gq_visitor", visitor);
    }
  } catch (e) { visitor = null; }
  const body = JSON.stringify({ q: q.id, lang, visitor });
  const url = "https://gakki-quiz-stats.puppetman03140823.workers.dev/api/hit";
  try {
    if (!(navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: "text/plain" })))){
      fetch(url, { method: "POST", body, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(() => {});
    }
  } catch (e) {}
})();
</script>
